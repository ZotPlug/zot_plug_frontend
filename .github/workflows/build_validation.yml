name: Frontend PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  buid:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node Env
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Deps
        run: npm ci

      - name: Build Frontend
        run: npm run build
