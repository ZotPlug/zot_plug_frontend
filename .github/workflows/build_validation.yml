name: Frontend PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  buid:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node Env
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Deps
        run: npm ci
        working-directory: ./web

      - name: Build Frontend
        run: npm run build
        working-directory: ./web

